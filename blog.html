<!DOCTYPE HTML>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

  <title>Blogs and Visualizations - Alec Helbling</title>

  <meta name="author" content="Alec Helbling">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" type="text/css" href="styles/index.css">
  <link rel="stylesheet" type="text/css" href="styles/blog.css">
  <link rel="icon" type="image/png" href="data/images/seal_icon.png">
  <script>
    /**
     * Load and render blog posts organized by year
     */
    let blogPosts = [];
    fetch('data/blog_posts.json', { cache: 'no-store' })
      .then(response => response.json())
      .then(data => {
        blogPosts = data;
        renderBlogPostsByYear();
      })
      .catch(error => console.error('Error loading blog posts:', error));

    /**
     * Build a single post-card <article> for the given post entry. Videos
     * are lazy: they don't fetch/decode until their card is about to
     * scroll into view, which is what actually keeps this page (every
     * post, not just the homepage's top few) from stalling on load when
     * there are many video previews.
     */
    function createPostCard(post, lazyVideos) {
      const article = document.createElement('article');
      article.className = 'post-card';

      const link = document.createElement('a');
      link.href = post.link;

      const mediaFrame = document.createElement('div');
      mediaFrame.className = 'media-frame';

      if (post.previewUrl) {
        if (post.previewUrl.endsWith('.mp4')) {
          const video = document.createElement('video');
          video.setAttribute('muted', '');
          video.setAttribute('autoplay', '');
          video.setAttribute('loop', '');
          video.setAttribute('playsinline', '');
          video.setAttribute('preload', 'none');
          video.muted = true;
          video.defaultMuted = true;
          video.autoplay = true;
          if (post.posterUrl) video.poster = post.posterUrl;
          video.setAttribute('aria-label', `${post.title} preview`);
          video.dataset.src = post.previewUrl;
          const source = document.createElement('source');
          source.dataset.src = post.previewUrl;
          source.type = 'video/mp4';
          video.appendChild(source);
          mediaFrame.appendChild(video);
          lazyVideos.push(video);
        } else {
          const img = document.createElement('img');
          img.loading = 'lazy';
          img.src = post.previewUrl;
          img.alt = post.title;
          mediaFrame.appendChild(img);
        }
      } else if (post.imageUrl) {
        const img = document.createElement('img');
        img.loading = 'lazy';
        img.src = post.imageUrl;
        img.alt = post.title;
        mediaFrame.appendChild(img);
      }

      const title = document.createElement('div');
      title.className = 'post-title';
      title.innerText = post.title;

      link.appendChild(mediaFrame);
      link.appendChild(title);
      article.appendChild(link);

      const meta = document.createElement('div');
      meta.className = 'post-meta';
      const [year, month, day] = post.date.split('-').map(Number);
      const date = new Date(year, month - 1, day);
      meta.innerText = date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
      article.appendChild(meta);

      return article;
    }

    /**
     * Render a list of posts grouped by year into the given container.
     * Any lazy <video> elements created along the way are pushed onto
     * lazyVideos for the caller to hand off to an IntersectionObserver.
     */
    function renderPostsByYear(posts, container, lazyVideos) {
      const postsByYear = {};
      posts.forEach(post => {
        if (!postsByYear[post.year]) {
          postsByYear[post.year] = [];
        }
        postsByYear[post.year].push(post);
      });

      const sortedYears = Object.keys(postsByYear).sort((a, b) => b - a);

      sortedYears.forEach(year => {
        const yearSection = document.createElement('section');
        yearSection.className = 'year-section';

        const heading = document.createElement('h2');
        heading.innerText = year;
        yearSection.appendChild(heading);

        const grid = document.createElement('div');
        grid.className = 'posts-grid';

        postsByYear[year].forEach(post => {
          grid.appendChild(createPostCard(post, lazyVideos));
        });

        yearSection.appendChild(grid);
        container.appendChild(yearSection);
      });
    }

    /**
     * Render blog posts and visualizations into their own top-level
     * sections (blogs first, to keep full write-ups more prominent than
     * the smaller quick visualizations), each grouped by year.
     */
    function renderBlogPostsByYear() {
      const blogContainer = document.getElementById('blog-posts-container');
      const vizContainer = document.getElementById('viz-posts-container');
      if (!blogContainer || !vizContainer) return;

      const lazyVideos = [];
      const blogs = blogPosts.filter(post => (post.type || 'blog') === 'blog');
      const visualizations = blogPosts.filter(post => post.type === 'visualization');

      renderPostsByYear(blogs, blogContainer, lazyVideos);
      renderPostsByYear(visualizations, vizContainer, lazyVideos);

      const loadAndPlayVideo = video => {
        video.querySelectorAll('source[data-src]').forEach(s => {
          s.src = s.dataset.src;
          delete s.dataset.src;
        });
        video.load();
        video.play().catch(() => {});
      };

      // Prioritize the first visualization row. Video decoding is handled by
      // the browser; previews farther down the page remain network-lazy.
      const eagerVideos = lazyVideos.splice(0, 3);
      eagerVideos.forEach(video => {
        video.setAttribute('preload', 'auto');
        loadAndPlayVideo(video);
      });

      if ('IntersectionObserver' in window) {
        const observer = new IntersectionObserver((entries, obs) => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            const video = entry.target;
            loadAndPlayVideo(video);
            obs.unobserve(video);
          });
        }, { rootMargin: '200px' });
        lazyVideos.forEach(v => observer.observe(v));
      } else {
        lazyVideos.forEach(loadAndPlayVideo);
      }
    }
  </script>
</head>

<body>
  <table style="width:100%;max-width:960px;border:0px;border-spacing:0px;border-collapse:separate;margin-right:auto;margin-left:auto;"><tbody>
    <tr style="padding:0px">
      <td style="padding:0px">
        <div class="blog-container">
          <div class="back-link">
            <a href="index.html">← Back to Home</a>
          </div>

          <p style="text-align:center">
            <name>Blogs and Visualizations</name>
          </p>
          <p style="text-align:center">Thoughts, videos, and updates.</p>

          <h2 class="type-section-heading">Blogs</h2>
          <div id="blog-posts-container"></div>

          <h2 class="type-section-heading">Visualizations</h2>
          <div id="viz-posts-container"></div>

        </div>
      </td>
    </tr>
  </table>
</body>

</html>
