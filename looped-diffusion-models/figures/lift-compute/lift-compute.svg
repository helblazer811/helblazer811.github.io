<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 425" role="img" aria-labelledby="title desc">
<title id="title">Fewer sampling steps can give better quality with more inner loops</title>
<desc id="desc">Same frozen LiFT L/2 R10 checkpoint. At two loops, 10, 25, 50, and 100 sampling steps give FIDs 33.633, 22.570, 20.304, and 19.422 at 1.614, 4.035, 8.070, and 16.139 TFLOPs per image. Four loops and 25 steps give FID 13.165 at 7.397 TFLOPs: better FID at lower cost than both the 50 and 100 step settings.</desc>
<style>text{font-family:Arial,sans-serif;fill:#36383d;font-size:13px}.muted{fill:#747982}.grid{stroke:#ececef;stroke-width:1}.accent{fill:#6651b8}</style>
<rect width="760" height="425" fill="white"/>
<text x="67" y="27" style="font-size:20px">Fewer sampling steps, better quality</text>
<text x="67" y="51" class="muted">Same LiFT checkpoint · change only loops and sampling steps</text>
