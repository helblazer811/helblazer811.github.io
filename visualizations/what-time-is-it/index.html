<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A visualization of how high-dimensional data geometry makes time conditioning optional for flow matching."
    />
    <title>What Time Is It? | Alec Helbling</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, "Times New Roman", serif;
        color: #20242b;
        background: #f7f6f2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      nav,
      main {
        width: min(1120px, calc(100% - 40px));
        margin-inline: auto;
      }

      nav {
        padding-top: 28px;
      }

      nav a,
      main a {
        color: #2456a6;
      }

      main {
        padding: 50px 0 72px;
      }

      header {
        max-width: 900px;
        margin-bottom: 34px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2.25rem, 6vw, 4.75rem);
        line-height: 0.98;
        letter-spacing: -0.04em;
      }

      .subtitle {
        margin: 0;
        font-size: clamp(1.15rem, 2.2vw, 1.65rem);
        line-height: 1.35;
        color: #555e6d;
      }

      .meta {
        margin-top: 18px;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 0.92rem;
        color: #697180;
      }

      figure {
        margin: 0;
      }

      video {
        display: block;
        width: 100%;
        aspect-ratio: 8 / 5;
        background: white;
        border: 1px solid #d9dce2;
        border-radius: 12px;
        box-shadow: 0 18px 50px rgb(24 32 45 / 12%);
      }

      figcaption {
        max-width: 850px;
        margin: 18px auto 0;
        text-align: center;
        font-size: 1.05rem;
        line-height: 1.55;
        color: #555e6d;
      }

      @media (max-width: 600px) {
        nav,
        main {
          width: min(100% - 24px, 1120px);
        }

        main {
          padding-top: 32px;
        }

        video {
          border-radius: 7px;
        }
      }
    </style>
  </head>
  <body>
    <nav><a href="https://alechelbling.com/blog.html">← Back to Blog</a></nav>
    <main>
      <header>
        <h1>What Time Is It?</h1>
        <p class="subtitle">How Data Geometry Makes Time Conditioning Optional for Flow Matching</p>
        <p class="meta">
          By <a href="https://alechelbling.com">Alec Helbling</a> · October 13, 2026 ·
          <a href="https://arxiv.org/abs/2605.08344">Read the paper</a>
        </p>
      </header>

      <figure>
        <video
          autoplay
          muted
          loop
          playsinline
          controls
          preload="metadata"
          poster="../../data/images/what-time-is-it-flow-matching-poster.jpg"
        >
          <source src="../../data/videos/what-time-is-it-flow-matching.mp4" type="video/mp4" />
          An animation showing how a noisy sample reveals its position along a flow-matching path.
        </video>
        <figcaption>
          In high-dimensional ambient space, the component orthogonal to the data subspace reveals
          how much noise remains, allowing a flow model to infer time directly from its input.
        </figcaption>
      </figure>
    </main>
  </body>
</html>
