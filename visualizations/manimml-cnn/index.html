<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="Alec Helbling" />
    <meta
      name="description"
      content="A layer-by-layer animation of a convolutional neural network, rendered with ManimML."
    />

    <title>Convolutional Neural Network — Alec Helbling</title>

    <link rel="canonical" href="https://alechelbling.com/visualizations/manimml-cnn/" />
    <link rel="icon" type="image/svg+xml" href="../../data/images/logo.svg" />
    <link rel="stylesheet" type="text/css" href="../../styles/index.css" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Convolutional Neural Network" />
    <meta
      property="og:description"
      content="A layer-by-layer animation of a convolutional neural network, rendered with ManimML."
    />
    <meta property="og:url" content="https://alechelbling.com/visualizations/manimml-cnn/" />
    <meta
      property="og:image"
      content="https://alechelbling.com/data/images/manimml-cnn-poster.jpg"
    />

    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: #222;
        background: #fff;
      }

      main {
        width: min(1280px, calc(100% - 40px));
        margin: 0 auto;
        padding: 36px 0 48px;
      }

      .back-link {
        display: inline-block;
        margin-bottom: 36px;
        font-size: 15px;
      }

      h1 {
        margin: 0;
        font-family: "Lato", Verdana, Helvetica, sans-serif;
        font-size: clamp(30px, 5vw, 46px);
        font-weight: 400;
        line-height: 1.15;
      }

      .lede {
        max-width: 720px;
        margin: 14px 0 28px;
        color: #555;
        font-size: 17px;
        line-height: 1.55;
      }

      .video-frame {
        overflow: hidden;
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 8px;
        background: #000;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.13);
      }

      video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .details {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 24px;
        margin-top: 18px;
        color: #666;
        line-height: 1.5;
      }

      .details p {
        margin: 0;
        font-size: 14px;
      }

      @media (max-width: 600px) {
        main {
          width: min(100% - 24px, 1280px);
          padding-top: 22px;
        }

        .back-link {
          margin-bottom: 28px;
        }

        .video-frame {
          border-radius: 5px;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <a class="back-link" href="../../blog.html">← Blogs and Visualizations</a>

      <h1>Convolutional Neural Network</h1>
      <p class="lede">
        A layer-by-layer animation of a convolutional neural network, rendered with
        ManimML.
      </p>

      <div class="video-frame">
        <video
          controls
          autoplay
          muted
          loop
          playsinline
          preload="metadata"
          poster="../../data/images/manimml-cnn-poster.jpg"
          aria-label="Animated convolutional neural network visualization"
        >
          <source src="../../data/videos/manimml-cnn.mp4" type="video/mp4" />
          Your browser does not support embedded MP4 video.
        </video>
      </div>

      <div class="details">
        <p>1920 × 1080 · 60 fps · 10 seconds</p>
        <p>
          Made with
          <a href="https://github.com/helblazer811/ManimML">ManimML</a>
        </p>
      </div>
    </main>
  </body>
</html>
